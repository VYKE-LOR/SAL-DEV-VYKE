<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sal_scba HUD</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="root" class="hidden">
        <div class="vignette" id="vignette"></div>

        <aside class="hud-card">
            <header>
                <p class="label">SCBA</p>
                <p id="status" class="status status-none">READY</p>
            </header>

            <section class="pressure-section">
                <div class="pressure-meta">
                    <span>Pressure</span>
                    <span id="pressureValue">0 / 100</span>
                </div>
                <div class="bar-wrap">
                    <div id="bar" class="bar-fill"></div>
                </div>
            </section>

            <section class="flags">
                <div id="maskFlag" class="flag">MASK</div>
                <div id="passFlag" class="flag">PASS</div>
            </section>

            <div id="warnBanner" class="warning hidden">LOW AIR</div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
